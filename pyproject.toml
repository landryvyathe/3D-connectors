[project]
name = "blender-connector"
version = "0.1.0"
description = "CodeBuddy MCP connector for Blender 4.2+/5.x — bridges the official Blender MCP add-on socket as MCP tools"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "landryvyathe" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
]
keywords = ["mcp", "blender", "codebuddy", "3d", "connector"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.scripts]
blender-connector = "blender_connector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_connector"]
